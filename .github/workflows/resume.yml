name: Update Resume PDF

on:
  workflow_dispatch:
  repository_dispatch:
    types: [resume-updated]

jobs:
  update-resume:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Download private resume
        env:
          GH_TOKEN: ${{ secrets.RESUME_TOKEN }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/cloemateo/resume/contents/resume.docx \
            --jq '.content' | base64 --decode > resume.docx

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Convert Word to PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir . resume.docx

      - name: Remove Word file
        run: |
          rm resume.docx

      - name: Check if PDF changed
        id: changes
        run: |
          if git diff --quiet -- resume.pdf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated PDF
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git commit -m "Update resume PDF"
          git push

      - name: Create portfolio reminder
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Resume updated — check portfolio" \
            --body "Your resume PDF was just updated automatically.

          Please check your portfolio website and make sure any information that changed in your resume is also reflected there.

          ### Portfolio checklist
          - [ ] About / Introduction
          - [ ] Education
          - [ ] Experience
          - [ ] Skills
          - [ ] Certifications
          - [ ] Projects
          - [ ] Resume download
          - [ ] LinkedIn

          Close this issue once the portfolio has been reviewed and updated."
